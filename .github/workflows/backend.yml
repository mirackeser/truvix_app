name: Backend

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend.yml"

# A new push supersedes an in-flight run on the same branch; there is no value
# in finishing a check against code that has already been replaced.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  WORKING_DIRECTORY: apps/backend

jobs:
  quality:
    name: Lint and types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Check formatting
        run: uv run ruff format --check src tests

      - name: Lint
        run: uv run ruff check src tests

      - name: Type check
        run: uv run mypy

      # The committed schema is what client generators consume, so an endpoint
      # change that skips regenerating it must fail review rather than ship.
      - name: Fail if the committed OpenAPI schema is stale
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code -- docs/openapi.json

  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: truvix
          POSTGRES_PASSWORD: truvix
          POSTGRES_DB: truvix_test
        ports:
          - 5432:5432
        # The job must not start querying before the server accepts connections.
        options: >-
          --health-cmd "pg_isready -U truvix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TRUVIX_TEST_DATABASE_DSN: postgresql+asyncpg://truvix:truvix@localhost:5432/truvix_test
      TRUVIX_TEST_REDIS_DSN: redis://localhost:6379/15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run tests
        run: uv run pytest --cov=truvix --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: ${{ env.WORKING_DIRECTORY }}/coverage.xml
          if-no-files-found: ignore

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: truvix
          POSTGRES_PASSWORD: truvix
          POSTGRES_DB: truvix_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U truvix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TRUVIX_DB_DSN: postgresql+asyncpg://truvix:truvix@localhost:5432/truvix_migrations
      TRUVIX_REDIS_DSN: redis://localhost:6379/0
      TRUVIX_SECURITY_SECRET_KEY: ci-only-signing-key-that-is-long-enough

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Apply every migration
        run: uv run alembic upgrade head

      # A migration that cannot be undone is a migration that cannot be rolled
      # back in production, so the full cycle is exercised on every change.
      - name: Verify the history is reversible
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Fail if the models have drifted from the schema
        run: uv run alembic check

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: [quality, test, migrations]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the backend image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.WORKING_DIRECTORY }}
          push: false
          load: true
          tags: truvix-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the image starts and reports itself alive
        run: |
          docker run --rm --detach --name truvix-ci \
            --env TRUVIX_DB_DSN=postgresql+asyncpg://truvix:truvix@localhost:5432/truvix \
            --env TRUVIX_REDIS_DSN=redis://localhost:6379/0 \
            --env TRUVIX_SECURITY_SECRET_KEY=ci-only-signing-key-that-is-long-enough \
            --publish 8000:8000 truvix-backend:ci
          for _ in $(seq 1 30); do
            if curl --silent --fail http://localhost:8000/health/live; then
              docker stop truvix-ci
              exit 0
            fi
            sleep 2
          done
          echo "The container never became live." >&2
          docker logs truvix-ci >&2
          docker stop truvix-ci
          exit 1
