<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Şifreni Sıfırla · Truvix</title>
    <meta name="description" content="Truvix hesabın için yeni bir şifre belirle." />
    <!-- The link carries a token that grants the account. Keeping it out of
         referrers stops it leaking to anything this page loads or links to. -->
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="assets/style.css" />
    <script src="assets/config.js"></script>
    <script src="assets/site.js" defer></script>
    <style>
      .field {
        display: block;
        margin: 1.25rem 0 0.4rem;
        color: var(--text-primary);
        font-weight: 600;
      }

      input[type="password"] {
        width: 100%;
        padding: 0.85rem 1rem;
        font-size: 1rem;
        color: var(--text-primary);
        background: var(--surface-elevated);
        border: 1px solid var(--border);
        border-radius: var(--radius);
      }

      input[type="password"]:focus {
        outline: 2px solid var(--brand);
        outline-offset: 1px;
      }

      button {
        width: 100%;
        margin-top: 1.5rem;
        padding: 0.95rem 1rem;
        font-size: 1rem;
        font-weight: 600;
        color: #06231a;
        background: var(--brand);
        border: 0;
        border-radius: var(--radius);
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      .hint {
        font-size: 0.85rem;
        color: var(--text-secondary);
        margin: 0.5rem 0 0;
      }

      .hint--error {
        color: var(--danger);
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="masthead">
        <a class="wordmark" href="/">TRUVIX</a>
      </header>

      <main>
        <div class="card" id="panel">
          <h1 style="margin-top: 0">Yeni şifreni belirle</h1>
          <p class="hint" id="intro">
            Şifren en az 10 karakter olmalı. Belirledikten sonra tüm
            cihazlardaki oturumların kapanır.
          </p>

          <form id="form" novalidate>
            <label class="field" for="password">Yeni şifren</label>
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="new-password"
              minlength="10"
              required
            />

            <label class="field" for="confirm">Yeni şifren (tekrar)</label>
            <input
              type="password"
              id="confirm"
              name="confirm"
              autocomplete="new-password"
              minlength="10"
              required
            />

            <p class="hint hint--error" id="error" role="alert" hidden></p>

            <button type="submit" id="submit">Şifremi Değiştir</button>
          </form>
        </div>
      </main>

      <footer class="colophon">
        <a href="terms.html">Kullanım Koşulları</a>
        <a href="privacy.html">Gizlilik Politikası</a>
      </footer>
    </div>

    <script>
      (function () {
        "use strict";

        // Mirrors PASSWORD_MIN_LENGTH in the backend's auth schemas. Checking
        // it here only saves a round trip; the backend enforces it regardless,
        // and the two must be changed together.
        var MINIMUM_LENGTH = 10;

        var panel = document.getElementById("panel");
        var form = document.getElementById("form");
        var password = document.getElementById("password");
        var confirm = document.getElementById("confirm");
        var error = document.getElementById("error");
        var submit = document.getElementById("submit");

        /** Replace the whole card with a final message. */
        function finish(ok, heading, message) {
          panel.className = "card status " + (ok ? "status--success" : "status--failure");
          panel.innerHTML = "";

          var icon = document.createElement("div");
          icon.className = "status__icon";
          icon.setAttribute("aria-hidden", "true");
          icon.textContent = ok ? "✓" : "✕";

          var title = document.createElement("p");
          title.className = "status__title";
          title.textContent = heading;

          var detail = document.createElement("p");
          detail.className = "status__detail";
          detail.textContent = message;

          panel.appendChild(icon);
          panel.appendChild(title);
          panel.appendChild(detail);
        }

        function showError(message) {
          error.textContent = message;
          error.hidden = false;
        }

        var token = new URLSearchParams(window.location.search).get("token");
        if (!token) {
          finish(
            false,
            "Bağlantı eksik",
            "Bu sayfaya e-postandaki bağlantıdan gelmen gerekiyor. " +
              "Bağlantıyı kopyalarken bir kısmı eksik kalmış olabilir."
          );
          return;
        }

        form.addEventListener("submit", function (event) {
          event.preventDefault();
          error.hidden = true;

          if (password.value.length < MINIMUM_LENGTH) {
            showError("Şifren en az " + MINIMUM_LENGTH + " karakter olmalı.");
            return;
          }
          if (password.value !== confirm.value) {
            showError("İki şifre birbirinin aynısı değil.");
            return;
          }

          submit.disabled = true;
          submit.textContent = "Gönderiliyor…";

          var base = (window.TRUVIX_SITE && window.TRUVIX_SITE.apiBaseUrl) || "";

          fetch(base + "/auth/password/reset", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: token, password: password.value }),
          })
            .then(function (response) {
              if (response.ok) {
                finish(
                  true,
                  "Şifren değiştirildi",
                  "Truvix uygulamasına dönüp yeni şifrenle giriş yapabilirsin."
                );
                return;
              }
              return response
                .json()
                .catch(function () {
                  return null;
                })
                .then(function (problem) {
                  submit.disabled = false;
                  submit.textContent = "Şifremi Değiştir";
                  showError(
                    (problem && problem.detail) ||
                      "Bağlantı geçersiz veya süresi dolmuş. Yeni bir bağlantı iste."
                  );
                });
            })
            .catch(function () {
              submit.disabled = false;
              submit.textContent = "Şifremi Değiştir";
              showError("Sunucuya ulaşılamadı. Bağlantını kontrol edip tekrar dene.");
            });
        });

        // The token grants the account, so it should not sit in the address bar
        // to be shared, bookmarked or read over a shoulder. Removing it before
        // the request would lose it, so it is captured above first.
        if (window.history && window.history.replaceState) {
          window.history.replaceState({}, "", window.location.pathname);
        }
      })();
    </script>
  </body>
</html>
